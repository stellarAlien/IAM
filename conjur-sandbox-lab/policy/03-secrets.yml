- !policy
  id: secrets
  body:
    - !variable payment-api-key
    - !variable fraud-model-key
    - !variable credential-version
    - !permit
      role: !group /lab/checkout-readers
      privileges: [read, execute]
      resource: !variable payment-api-key
    - !permit
      role: !group /lab/fraud-readers
      privileges: [read, execute]
      resource: !variable fraud-model-key
    - !permit
      role: [!group /lab/checkout-readers, !group /lab/fraud-readers]
      privileges: [read, execute]
      resource: !variable credential-version
