apiVersion: v1
kind: Namespace
metadata:
  name: conjur-lab
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-config
  namespace: conjur-lab
data:
  CONJUR_ACCOUNT: sandbox
  CONJUR_CERT_FILE: /run/conjur/ca/tls.crt
  CONJUR_AUTHN_API_KEY_FILE: /run/conjur/identity/api-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: conjur-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: checkout
          image: conjur-sandbox-app:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          envFrom: [{configMapRef: {name: workload-config}}, {configMapRef: {name: conjur-endpoint}}]
          env:
            - {name: WORKLOAD, value: checkout}
            - {name: CONJUR_AUTHN_LOGIN, value: host/lab/checkout}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          volumeMounts:
            - {name: ca, mountPath: /run/conjur/ca, readOnly: true}
            - {name: identity, mountPath: /run/conjur/identity, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: ca
          configMap: {name: conjur-ca}
        - name: identity
          secret: {secretName: checkout-identity, defaultMode: 0440}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud
  namespace: conjur-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: fraud}
  template:
    metadata:
      labels: {app: fraud}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fraud
          image: conjur-sandbox-app:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          envFrom: [{configMapRef: {name: workload-config}}, {configMapRef: {name: conjur-endpoint}}]
          env:
            - {name: WORKLOAD, value: fraud}
            - {name: CONJUR_AUTHN_LOGIN, value: host/lab/fraud}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          volumeMounts:
            - {name: ca, mountPath: /run/conjur/ca, readOnly: true}
            - {name: identity, mountPath: /run/conjur/identity, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: ca
          configMap: {name: conjur-ca}
        - name: identity
          secret: {secretName: fraud-identity, defaultMode: 0440}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: conjur-lab
spec:
  selector: {app: checkout}
  ports: [{port: 8080, targetPort: http, name: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: fraud
  namespace: conjur-lab
spec:
  selector: {app: fraud}
  ports: [{port: 8080, targetPort: http, name: http}]
