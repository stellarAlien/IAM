events { worker_connections 256; }
http {
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 4k;
    limit_req_zone $binary_remote_addr zone=messages:10m rate=10r/s;
    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header X-Content-Type-Options nosniff always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        location = /healthz { return 200 'gateway-live'; }
        location = /tenants/acme/dev/messages {
            limit_req zone=messages burst=20 nodelay;
            proxy_pass http://acme-dev:8080/messages;
        }
        location = /tenants/acme/prod/messages {
            limit_req zone=messages burst=20 nodelay;
            proxy_pass http://acme-prod:8080/messages;
        }
        location = /tenants/globex/dev/messages {
            limit_req zone=messages burst=20 nodelay;
            proxy_pass http://globex-dev:8080/messages;
        }
        location = /tenants/globex/prod/messages {
            limit_req zone=messages burst=20 nodelay;
            proxy_pass http://globex-prod:8080/messages;
        }
        location / { return 404; }
    }
}
